[PATHS]
# GUI 默认路径（包含 VipSongsDownload 后缀）
input_dir = D:\Music\QQMusic\Download
output_dir = D:\Music\QQMusic\Decrypted

[LOGGING]
log_level = INFO
log_file = logs/decrypt.log
save_stats = true

[OPTIONS]
preserve_structure = true
skip_existing = true
max_retries = 3
retry_delay = 2
verify_metadata = true
# 删除功能配置
delete_source = true
delete_empty_dirs = true
delete_lyrics = true
# 元数据处理模式
# inline: 逐个文件处理（旧方式）
# batch: 批量处理（新方式，推荐）
metadata_processing_mode = batch
# 跳过解密时的元数据修改（在批量模式下应该为 true）
skip_metadata_during_decrypt = true

[OUTPUT]
# 解密后输出目录的整理方式：
# album  = 按专辑分文件夹（推荐）
#          合并同一张专辑散落在不同歌手文件夹中的曲目，按音轨号排序，
#          歌词同步改名为与音频同名，并修正 [ti]/[ar]/[al]
# artist = 按主歌手分文件夹，文件夹内按歌名排序
# flat   = 不分文件夹，所有歌曲直接放在输出目录
folder_mode = album

[NOTIFICATIONS]
show_completion = true
show_summary = true
